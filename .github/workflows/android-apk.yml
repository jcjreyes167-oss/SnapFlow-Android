name: Compilar APK SnapFlow
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Instalar Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Testar leitura e validação de URLs
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Compilar APK v3.3
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapFlow-v3.3-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
